name: bochki_schedule_app
description: Application package for the Bochki Schedule desktop app.
publish_to: none
version: 0.13.5

environment:
  sdk: ^3.5.0

dependencies:
  archive: ^4.0.7
  bochki_schedule_domain:
    path: ../bochki_schedule_domain
  bochki_schedule_infra:
    path: ../bochki_schedule_infra
  # #183 macOS A/B experiment: 0.3.1 native code plus the hidden-start patch.
  desktop_multi_window:
    path: ../../third_party/desktop_multi_window
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.5
  screen_retriever: ^0.2.1
  window_manager:
    path: ../../third_party/window_manager

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
