name: macOS lifecycle debug

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: macOS research scenario to run
        required: true
        default: minimal
        type: choice
        options:
          - minimal
          - upstream-smoke
          - framework

permissions:
  contents: read

concurrency:
  group: macos-lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-lifecycle:
    if: inputs.scenario != 'framework'
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        run: |
          FLUTTER_VERSION="$(python3 - <<'PY'
          import json
          print(json.load(open('.fvmrc'))['flutter'])
          PY
          )"
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install workspace dependencies
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Run upstream macOS multi-window probe
        working-directory: packages/bochki_schedule_app
        run: |
          set -o pipefail
          if [ "${{ inputs.scenario }}" = 'upstream-smoke' ]; then
            flutter run -d macos --dart-define=UPSTREAM_MULTI_WINDOW_SMOKE=true -t lib/macos_upstream_multi_window_probe.dart 2>&1 | tee multi-window-lifecycle.log
            grep -F '[macos-upstream-0.3.1] PASS upstream child smoke lifecycle' multi-window-lifecycle.log
          else
            flutter run -d macos -t lib/macos_upstream_multi_window_probe.dart 2>&1 | tee multi-window-lifecycle.log
            grep -F '[macos-upstream-0.3.1] PASS upstream child lifecycle and message exchange' multi-window-lifecycle.log
          fi
          ! grep -nE 'FlutterEngineOnVsync.*kInternalInconsistency|Unhandled platform error|WindowChannelException' multi-window-lifecycle.log

      - name: Upload macOS lifecycle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-multi-window-lifecycle-log
          path: packages/bochki_schedule_app/multi-window-lifecycle.log
          if-no-files-found: ignore

  framework-windowing-probe:
    if: inputs.scenario == 'framework'
    runs-on: macos-15
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout Flutter windowing reference revision
        uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: ab5637ab27ab1c6ca6885ebdb9cce2d6570b943b
          path: .tool/flutter-reference
          fetch-depth: 1

      - name: Set up Flutter main channel
        uses: subosito/flutter-action@v2
        with:
          channel: main

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install workspace dependencies
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Run framework windowing probe
        working-directory: packages/bochki_schedule_app
        run: |
          set -o pipefail
          flutter --enable-windowing run -d macos --dart-define=FRAMEWORK_WINDOWING_PROBE=true -t lib/main.dart 2>&1 | tee framework-windowing-probe.log
          rg -F '[framework-windowing-probe] PASS child first frame reached main' framework-windowing-probe.log

      - name: Upload framework windowing probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-framework-windowing-probe-log
          path: packages/bochki_schedule_app/framework-windowing-probe.log
          if-no-files-found: ignore
