name: macOS framework windowing probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-windowing-probe:
    runs-on: macos-15
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout Flutter windowing reference revision
        uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: ab5637ab27ab1c6ca6885ebdb9cce2d6570b943b
          path: .tool/flutter
          fetch-depth: 1

      - name: Add Flutter to PATH
        run: echo "$GITHUB_WORKSPACE/.tool/flutter/bin" >> "$GITHUB_PATH"

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install workspace dependencies
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Run framework windowing probe
        working-directory: packages/bochki_schedule_app
        run: |
          set -o pipefail
          flutter test integration_test/macos_framework_windowing_probe_test.dart -d macos --enable-windowing -r expanded 2>&1 | tee framework-windowing-probe.log

      - name: Upload framework windowing probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-framework-windowing-probe-log
          path: packages/bochki_schedule_app/framework-windowing-probe.log
          if-no-files-found: ignore
