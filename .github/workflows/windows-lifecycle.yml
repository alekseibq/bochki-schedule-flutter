name: Windows lifecycle debug

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-lifecycle:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        shell: pwsh
        run: |
          $version = (Get-Content .fvmrc | ConvertFrom-Json).flutter
          "FLUTTER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install workspace dependencies
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Run upstream Windows multi-window lifecycle probe
        shell: pwsh
        working-directory: packages/bochki_schedule_app
        run: |
          flutter run -d windows -t lib/macos_upstream_multi_window_probe.dart 2>&1 | Tee-Object -FilePath multi-window-lifecycle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Select-String -Path multi-window-lifecycle.log -SimpleMatch '[macos-upstream-0.3.1] PASS upstream child lifecycle and message exchange'
          if (Select-String -Path multi-window-lifecycle.log -Pattern 'FlutterEngineOnVsync.*kInternalInconsistency|Unhandled platform error|WindowChannelException') {
            throw 'Windows lifecycle probe emitted a forbidden error.'
          }

      - name: Upload Windows lifecycle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-multi-window-lifecycle-log
          path: packages/bochki_schedule_app/multi-window-lifecycle.log
          if-no-files-found: ignore
